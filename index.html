
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeartMirror</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-HQ6DCHH894"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-HQ6DCHH894');
  </script>
  <style>
    body {
      margin: 0;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .heart {
      width: 100px;
      height: 90px;
      position: relative;
      animation: pulse 1.5s infinite;
      cursor: pointer;
      transition: filter 0.3s ease;
    }

    .heart:hover {
      filter: brightness(1.2);
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 100px;
      height: 90px;
      background: red;
      border-radius: 50px 50px 0 0;
    }

    .heart::before {
      left: 0;
      transform: rotate(-45deg);
      transform-origin: 0 100%;
    }

    .heart::after {
      left: 0;
      transform: rotate(45deg);
      transform-origin: 100% 100%;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
      100% {
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <div class="heart" id="heart"></div>

  <script>
    // Track page open event
    gtag('event', 'page_open', {
      'page_title': document.title,
      'page_path': window.location.pathname
    });

    // Track time on page
    let pageOpenTime = Date.now();
    
    window.addEventListener('beforeunload', function() {
      let timeOnPage = Math.round((Date.now() - pageOpenTime) / 1000);
      gtag('event', 'time_on_page', {
        'seconds': timeOnPage,
        'page_title': document.title
      });
    });

    // Track heart clicks
    document.getElementById('heart').addEventListener('click', function() {
      gtag('event', 'heart_click', {
        'interaction_type': 'click',
        'timestamp': new Date().toISOString()
      });
    });
  </script>
</body>
</html>
