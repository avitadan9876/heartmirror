
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="2E8Jkk2XO2GgiY3BFLsl0-l3gpPQ_jgdTP8qjEbok-0" />
  <title>HeartMirror</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-V8L8NCJVDX"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-V8L8NCJVDX');

    var openedAt = Date.now();
    var lastReportedSeconds = -1;
    gtag('event', 'page_open', {
      page_location: location.href,
      page_title: document.title,
      language: navigator.language || ''
    });

    function reportTimeOnPage() {
      var seconds = Math.max(0, Math.round((Date.now() - openedAt) / 1000));
      if (seconds === lastReportedSeconds) return;
      lastReportedSeconds = seconds;
      gtag('event', 'time_on_page', {
        engagement_time_msec: seconds * 1000,
        seconds_on_page: seconds
      });
    }

    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') reportTimeOnPage();
    });
    window.addEventListener('pagehide', reportTimeOnPage);
  </script>
  <style>
    body {
      margin: 0;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .heart {
      width: 100px;
      height: 90px;
      position: relative;
      animation: pulse 1.5s infinite;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 100px;
      height: 90px;
      background: red;
      border-radius: 50px 50px 0 0;
    }

    .heart::before {
      left: 0;
      transform: rotate(-45deg);
      transform-origin: 0 100%;
    }

    .heart::after {
      left: 0;
      transform: rotate(45deg);
      transform-origin: 100% 100%;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
      100% {
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <div class="heart"></div>
</body>
</html>
